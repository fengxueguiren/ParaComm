name: opv2v_coalign_paracom_atomtop4_bit4_topratio01_tile_size1

root_dir: "dataset/OPV2V_home/train"
validate_dir: "dataset/OPV2V_home/validate"
test_dir: "dataset/OPV2V_home/test"

yaml_parser: "load_point_pillar_params"

train_mode: finetune_from_noncomm # 'scratch_comm', 'resume', 'finetune_from_noncomm'
pretrained_noncomm_dir: "opencood/logs/opv2v_coalign_pretrain"
finetune:
  freeze_unlisted: true
  strict_load: false
  trainable_module_prefixes:
    - scatter
    - pillar_vfe
    - backbone
    - shrink_conv
    - dict_comm
    - cls_head
    - reg_head
    - dir_head

train_params:
  batch_size: &batch_size 4
  epoches: 20
  eval_freq: 2
  save_freq: 2
  max_cav: &max_cav 5

input_source: ['lidar']
label_type: 'lidar'

comm_range: 70

fusion:
  core_method: 'intermediate'
  dataset: 'opv2v'
  args:
    proj_first: false

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

model:
  core_method: point_pillar_sparse_dict_multiscale
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    fusion_method: att
    att:
      feat_dim: [64, 128, 256]

    dict_comm:
      enabled: true
      dict_size: 64
      atom_topk: 4
      grouped_indexing_enabled: true
      group_tile_size: 1 # only used when grouped_indexing_enabled is true
      group_atom_count: 4 # only used when grouped_indexing_enabled is true
      sparse_method: topk # 'soft_threshold', 'relu_threshold', 'topk'
      topk_ratio: 0.10 # 10% of features will be selected at most when using topk sparsification, only used if sparse_method is set to 'topk'
      # topk_min: 128
      # topk: null
      # target_comm_rate: 0.05
      # lambda: 0.2 # only used for soft thresholding
      # relu_threshold: 0.02 # only used for ReLU thresholding
      float_bits: 16
      sparse_coeff_bits: 4
      enable_coeff_quant: true
      transmit_only_sparse: true
      include_index_bits: true
      restore_hidden: 64
      topk_train_noise: 1e-8
      score_temperature: 1.0
      score_use_sigmoid: true
      backbone:
        enabled: true
        type: convnext
        dim: 64
        num_of_blocks: 2
        kernel_size: 7
        deform: false
      restore_backbone:
        enabled: true
        share_with_comm: true
        type: convnext
        dim: 64
        num_of_blocks: 2
        kernel_size: 7
        deform: false
      encoder_head:
        hidden_dim: 64
        num_convs: 2
        kernel_size: 3
      scorer_head:
        hidden_dim: 64
        num_convs: 2
        kernel_size: 3
      recon_loss_type: l1
      recon_loss_weight: 0.2
      sparse_loss_weight: 0
      coherence_loss_weight: 1e-3
      budget_loss_weight: 1e-3
      # budget_loss_weight: 0

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    dir_args: *dir_args

loss:
  core_method: point_pillar_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 2.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  # step_size: [3, 5, 7, 9]
  step_size: [5, 10, 15]
